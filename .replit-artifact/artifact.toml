kind = "web"
previewPath = "/"
title = "OkSchool"
version = "1.0.0"
id = "artifacts/okschool"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25934

[services.development]
run = "pnpm --filter @workspace/okschool run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/okschool", "run", "build" ]
publicDir = "artifacts/okschool/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25934"
BASE_PATH = "/"
